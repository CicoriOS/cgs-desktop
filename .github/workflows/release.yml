# A pushed tag v<version> (npm run release:bump) builds the Windows installer and the Linux AppImage on their native
# runners, then publishes both, with the electron-updater metadata (latest.yml, latest-linux.yml, blockmaps), as the
# GitHub release v<version> that packaged apps update from.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual runs build and upload the artifacts without publishing a release.
  workflow_dispatch:
    inputs:
      newapi_ref:
        description: CicoriOS/newapi branch, tag or commit to build cgs-agent from
        default: main

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            dist: dist:linux
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$version"; exit 1; }
      # cgs-agent is built from new-api's tunnelkit (scripts/build-agent.mjs); NEWAPI_TOKEN is a GitHub token that can
      # read the private CicoriOS/newapi. The agent embeds the production root keys, so it must match the deployed server.
      - uses: actions/checkout@v4
        with:
          repository: CicoriOS/newapi
          token: ${{ secrets.NEWAPI_TOKEN }}
          ref: ${{ inputs.newapi_ref || 'main' }}
          persist-credentials: false
          path: new-api
      - uses: actions/setup-go@v5
        with:
          go-version-file: new-api/tunnelkit/go.mod
          cache: false
      - run: npm ci
      - run: npm test
      - name: Build (fetch ompweb, omp runner, Chromium, cgs-agent; package)
        run: npm run ${{ matrix.dist }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGS_NEWAPI_DIR: ${{ github.workspace }}/new-api
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --title "CGS Desktop $GITHUB_REF_NAME" --generate-notes
          fi

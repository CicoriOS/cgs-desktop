<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>CGS Desktop</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1e1e1e;
    --text: #f2f2f2;
    --ring: #3a3a3a;
    --accent: #a76ad9;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --text: #1f1b24;
      --ring: #e6e6e6;
      --accent: #9453c9;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .brand-logo { width: 48px; height: 48px; display: block; }
  .spinner { width: 24px; height: 24px; border: 2.5px solid var(--ring); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <svg class="brand-logo" viewBox="0 0 64 64" role="img" aria-label="omp logo">
    <defs>
      <linearGradient id="ompweb-g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ed4abf" />
        <stop offset="0.5" stop-color="#9b4dff" />
        <stop offset="1" stop-color="#5ad8e6" />
      </linearGradient>
    </defs>
    <rect width="64" height="64" rx="12" fill="#0f0a14" />
    <path fill="url(#ompweb-g)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z" />
  </svg>
  <div class="spinner"></div>
  <div>正在启动 CGS Desktop…</div>
</main>
</body>
</html>
